[build-system]
requires = ['setuptools~=84.2.1']
build-backend = 'setuptools.build_meta'

[project]
name = 'revefi-dbt-client'
authors = [
    { name = 'Revefi' },
]
description = 'Package to upload dbt core files to Revefi'
requires-python = '>=3.11,<3.17'
classifiers = [
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: 3.16',
    'Operating System :: OS Independent',
]
license = { file = 'LICENSE' }
dependencies = ['requests~=2.34.2', 'dynaconf~=3.3.5', 'tenacity~=9.2.1']
dynamic = ["version", "readme"]

[project.urls]
'Homepage' = 'https://github.com/revefi/dbt_python_client'

[project.scripts]
revefi-dbt-client = 'revefi_dbt_client.main:main'

[tool.setuptools.packages.find]
where = ['src']
exclude = [
    '*.tests',
    '*.tests.*',
    'tests.*',
    'tests',
]

[tool.setuptools.dynamic]
version = { attr = 'revefi_dbt_client.__version__' }
readme = { file = ['README.md'], content-type = 'text/markdown' }

[tool.pytest.ini_options]
minversion = '6.0'
pythonpath = 'src'
