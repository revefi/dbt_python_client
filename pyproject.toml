[build-system]
requires = ["setuptools>=82.0.1,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "revefi-dbt-client"
version = "0.2.0+python.3.9"
authors = [
    { name = "Revefi" },
]
description = "Package to upload dbt core files to Revefi"
readme = "README.md"
requires-python = ">=3.9,<3.10"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "dynaconf~=3.2.13",
    "requests~=2.32.5",
    "tenacity~=9.1.2",
]

[dependency-groups]
dev = [
    "coverage~=7.10.7",
    "pytest~=8.4.2",
]

[project.urls]
Homepage = "https://github.com/revefi/dbt_python_client"

[project.scripts]
revefi-dbt-client = "revefi_dbt_client.main:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = "src"
