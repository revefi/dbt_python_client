[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "revefi-dbt-client"
version = "0.2.0"
authors = [
    { name = "Revefi" },
]
description = "Package to upload dbt core files to Revefi"
readme = "README.md"
requires-python = ">=3.11,<=3.15"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "dynaconf~=3.2.13",
    "requests~=2.34.2",
    "tenacity~=9.2.1",
]

[dependency-groups]
dev = [
    "coverage~=7.16.2",
    "pytest~=9.1.1",
]

[project.urls]
Homepage = "https://github.com/revefi/dbt_python_client"

[project.scripts]
revefi-dbt-client = "revefi_dbt_client.main:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
]

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = "src"
