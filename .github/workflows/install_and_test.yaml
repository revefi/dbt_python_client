name: Install and Test
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  install_and_test:
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
        os:
          - 'ubuntu-latest'
          - 'macos-latest'
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
      PYTHON_VERSION: ${{ matrix.python_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python_version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install from the checked-out source with pip
        run: python -m pip install .

      - name: Verify the pip installation
        run: |
          python -m pip show revefi-dbt-client
          revefi-dbt-client --help

      - name: Uninstall the package with pip
        run: python -m pip uninstall --yes revefi-dbt-client

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Show OS and Python version
        run: |
          uv run --locked --no-sync python -c 'import platform; print("OS: ", platform.platform()); print("Python: ", platform.python_version())'

      - name: Run (legacy) 'revefi-dbt-client'
        run: |
          # Test if the module is installed and is available in the path
          # This is the legacy way of running the module
          uv run --locked --no-sync python -m revefi-dbt-client.upload --help

      - name: Run 'revefi-dbt-client'
        run: |
          # Test if the module is installed and is available in the path
          uv run --locked --no-sync revefi-dbt-client --help

      - name: Test setting '--ignore-error' results in exit code 0
        run: |
          # This shall fail, however, --ignore-error is set and the command shall exit with 0 
          uv run --locked --no-sync revefi-dbt-client \
            --token definitely-a-real-token \
            --project_folder /path/to/project/dir \
            --target_folder custom_target_dir \
            --logs_folder /path/to/logs/dir \
            --ignore-error

      - name: Run unit tests with coverage
        run: uv run --locked --no-sync coverage run -m pytest --verbose

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          name: RevefiDbtClient
          env_vars: OS,PYTHON_VERSION
          flags: unittests

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci
